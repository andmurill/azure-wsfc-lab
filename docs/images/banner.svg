<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Azure Windows Server Failover Cluster Lab</title>
  <desc id="desc">Banner showing a failover cluster of two nodes with a domain controller and a cloud witness</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#14447d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>

  <!-- Text -->
  <text x="60" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Azure Failover Cluster Lab</text>
  <text x="60" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#9cc9ff">Windows Server 2022 · Terraform · Cloud Witness</text>
  <text x="60" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#c9d6e8">One apply builds a domain controller, two nodes, a cluster and a witness</text>

  <!-- Diagram: cluster, nodes, domain controller, witness -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">
    <!-- connectors -->
    <line x1="845" y1="150" x2="900" y2="86" stroke="#5aa9ff" stroke-width="2"/>
    <line x1="1035" y1="150" x2="980" y2="86" stroke="#5aa9ff" stroke-width="2"/>
    <line x1="910" y1="215" x2="845" y2="196" stroke="#5aa9ff" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="970" y1="215" x2="1035" y2="196" stroke="#5aa9ff" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="1050" y1="63" x2="1075" y2="63" stroke="#5aa9ff" stroke-width="2" stroke-dasharray="5 4"/>

    <!-- cluster -->
    <rect x="830" y="40" width="220" height="46" rx="23" fill="none" stroke="#5aa9ff" stroke-width="2"/>
    <text x="940" y="69" fill="#ffffff">WSFC01 cluster</text>

    <!-- witness -->
    <rect x="1075" y="40" width="95" height="46" rx="10" fill="#13365f" stroke="#5aa9ff" stroke-width="2"/>
    <text x="1122" y="69" fill="#ffffff">Witness</text>

    <!-- nodes -->
    <rect x="780" y="150" width="130" height="46" rx="10" fill="#1c4f8c" stroke="#5aa9ff" stroke-width="2"/>
    <text x="845" y="179" fill="#ffffff">NODE1</text>
    <rect x="970" y="150" width="130" height="46" rx="10" fill="#1c4f8c" stroke="#5aa9ff" stroke-width="2"/>
    <text x="1035" y="179" fill="#ffffff">NODE2</text>

    <!-- domain controller -->
    <rect x="875" y="215" width="130" height="40" rx="10" fill="#13365f" stroke="#5aa9ff" stroke-width="2"/>
    <text x="940" y="240" fill="#ffffff">DC01 · AD DS</text>
  </g>
</svg>
